name: CI

on:
  push:
    branches: [main, next]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://lacus:lacus@localhost:5432/lacus_crm
  # Valores descartáveis, só para passar na validação de env.
  BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only
  BETTER_AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  TOKEN_ENCRYPTION_KEY: ci-only-key-ci-only-key-ci-only-key
  CRON_SECRET: ci-only-cron-secret
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lacus
          POSTGRES_PASSWORD: lacus
          POSTGRES_DB: lacus_crm
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lacus -d lacus_crm"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # ESLint, Vitest, Next e Drizzle Kit rodam em Node; o Bun só instala e orquestra.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Cache Bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile

      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test

      - name: Migrations up, down, up
        run: |
          bun run db:migrate
          bun run db:rollback all
          bun run db:migrate
          bun run db:status --strict
      - run: bun run db:seed
      - name: Integração (triggers)
        run: bun run test:int

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run audit:deps
